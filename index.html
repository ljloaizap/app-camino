<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>El Camino de Santiago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="cover" class="page-cover">
    <aside class="sound-dock" data-persist aria-label="Sonido ambiental">
      <button class="sound-toggle" type="button" data-sound-toggle aria-pressed="false">
        <svg class="sound-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z" />
          <path class="sound-toggle__wave" d="M15.5 8.5a5 5 0 0 1 0 7" />
          <path class="sound-toggle__wave" d="M18.5 5.5a9 9 0 0 1 0 13" />
          <path class="sound-toggle__off" d="m16 9 5 6m0-6-5 6" />
        </svg>
        <span class="sound-toggle__label" data-sound-label>Activar sonido</span>
      </button>
    </aside>

    <main id="main" class="cover">
      <section class="booklet" aria-labelledby="cover-title">
        <p class="booklet__kicker">Credencial del peregrino (2026)</p>
        <h1 id="cover-title" class="booklet__title">El Camino de Santiago</h1>

        <div class="booklet__shell">
          <button class="shell-toggle" type="button" data-reveal aria-expanded="false" aria-controls="shell-back">
            <span class="visually-hidden">Dar la vuelta a la vieira</span>
            <span class="shell-toggle__front" data-art="shell" data-art-label=""></span>
            <span class="shell-toggle__back" id="shell-back" hidden>Feliz cumple! 🥳🎉🎈🎁 Bienvenida :)</span>
          </button>
          <p class="booklet__hint">Toca la vieira</p>
        </div>

        <a class="btn btn--cream" href="credential.html?leaf=1" data-start-sound>Abrir credencial</a>
      </section>
    </main>

    <script src="js/gate.js" defer></script>
    <script src="js/art.js" defer></script>
    <script src="js/album.js" defer></script>
    <script src="js/content.js" defer></script>
    <script src="js/stamps.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/music.js" defer></script>
  </body>
</html>
