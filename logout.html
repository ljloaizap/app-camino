<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cerrar sesión — El Camino de Santiago</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="logout" class="page-logout">
    <main class="logout" aria-live="polite">
      <p class="logout__text">Cerrando sesión…</p>
    </main>
    <script>
      localStorage.removeItem('camino.access');
      sessionStorage.removeItem('camino.access');
      sessionStorage.removeItem('camino.credentialLeaf');
    </script>
    <script src="js/gate.js"></script>
  </body>
</html>
