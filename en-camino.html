<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>En camino… — El Camino de Santiago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="en-camino" class="page-en-camino">
    <main id="main" class="en-camino">
      <article class="en-camino__card paper" aria-labelledby="en-camino-title">
        <div class="en-camino__scene" aria-hidden="true">
          <svg class="en-camino__sky" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice">
            <path class="en-camino__path" d="M0 92 Q100 88 200 92 T400 90" fill="none" stroke="currentColor" stroke-width="1.2" />
            <g class="en-camino__walker">
              <path d="M68 70v22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <path class="en-camino__leg en-camino__leg--a" d="M68 92h-10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <path class="en-camino__leg en-camino__leg--b" d="M68 92h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <path d="M68 78h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <circle cx="68" cy="58" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M82 76c6-2 10-6 12-12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" />
              <path d="M78 70c4 3 10 4 16 2" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" />
              <path
                d="M92 58c3 4 2 9-1 13-2 2.5-4 4-4 8"
                stroke="currentColor"
                stroke-width="1.2"
                fill="rgba(166,83,61,0.12)"
                stroke-linecap="round"
              />
            </g>
          </svg>
        </div>

        <p class="kicker"></p>
        <h1 id="en-camino-title">Credencial en Camino</h1>
        <p class="en-camino__text">
          Parece que te has desviado de la ruta, pero no te preocupes, nuestra credencial también está en camino.
        </p>
        <p class="en-camino__text en-camino__text--soft">
          Cuando tengas la llave correcta, podrás llegar a Santiago de Compostela.
        </p>
        <a class="btn" href="index.html">Volver a intentar</a>
      </article>
    </main>

    <script src="js/gate.js" defer></script>
  </body>
</html>
